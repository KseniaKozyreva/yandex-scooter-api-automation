name: UI Scooter Autotests
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Firefox and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb
      - name: Run PyTest via xvfb
        run: |
          export LANG=ru_RU.UTF-8 && export TZ=Europe/Moscow && xvfb-run --server-args="-screen 0 1920x1080x24" pytest -v --alluredir=allure-results
        continue-on-error: true
      - name: Generate Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
      - name: Deploy Report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
