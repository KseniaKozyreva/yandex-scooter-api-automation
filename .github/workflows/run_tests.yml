name: UI Scooter Autotests

on:
  push:
    branches: [ main ]

# Разрешаем роботу публиковать отчет на GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем твой код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Устанавливаем твои библиотеки из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Устанавливаем Firefox и виртуальный дисплей (xvfb) для Linux
      - name: Install Firefox and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb

      # 5. Запускаем тесты ПРЯМО внутри виртуального дисплея xvfb-run
      # Это обманет Firefox, и он запустится без реального монитора!
      - name: Run PyTest UI Tests
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" pytest -v --alluredir=allure-results
        continue-on-error: true

      # 6. Собираем Allure-отчет
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      # 7. Выкладываем красивый отчет в сеть
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-deploy-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
